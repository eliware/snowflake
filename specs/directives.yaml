version: "12.0"
description: Defines behavior and limits for the Snowflake ID generator.
requires: []
conflicts: []
directives:
  - id: E-106.0
    dos:
      - Generate time-ordered Snowflake IDs.
      - Return each ID as a decimal string.
      - Use configurable epoch and identity values.
    donts:
      - Do not present generated IDs as secrets.
    children:
      - id: E-106.0.0
        dos:
          - Validate worker and process IDs before generation.
          - Reject timestamps before the configured epoch.
        donts:
          - Do not permit identity values outside the supported bit range.
      - id: E-106.0.1
        dos:
          - Protect generation from clock rollback.
          - Report sequence overflow before an ID can repeat.
        donts:
          - Do not return an ID when the sequence overflows.
