version: "14.0"
description: Defines behavior and limits for the Snowflake ID generator.
directives:
  - id: E-106.0
    dos:
      - Create time-ordered Snowflake IDs.
      - Return each ID as a decimal string.
      - Use configurable epoch and identity values.
    donts:
      - Do not show generated IDs as secrets.
    children:
      - id: E-106.0.0
        dos:
          - Validate worker and process IDs before generation.
          - Reject the first clock value when it is before the configured epoch.
          - Apply rollback handling to a later clock value before the configured epoch.
          - Use the last valid timestamp after a rollback.
        donts:
          - Do not create an ID from a timestamp before the configured epoch.
          - Do not use identity values outside the supported bit range.
      - id: E-106.0.1
        dos:
          - Keep IDs unique when the clock returns a lower value.
          - Report sequence overflow before an ID can repeat.
        donts:
          - Do not return an ID when the sequence overflows.
