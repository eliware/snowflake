version: "13.0"
description: Defines repository requirements for the Snowflake ID library.
directives:
  - id: E-106.1
    dos:
      - Preserve the documented Snowflake ID behavior.
      - Return IDs as decimal strings.
      - Keep credentials and private data private.
      - Pass repository validation before inspection.
    donts:
      - Do not use IDs as secrets or authentication tokens.
